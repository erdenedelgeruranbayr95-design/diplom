services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medreh
      POSTGRES_PASSWORD: medreh_dev_pw
      POSTGRES_DB: medreh
    ports:
      # .env-ийн DATABASE_URL-тай ижил байх ёстой. Өмнө нь 5433 байсан тул `docker compose up`
      # хийхэд бодит DB (5434)-ээс тусдаа, хоосон хоёр дахь DB босдог зөрчилтэй байв.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # .env-ийн REDIS_URL-тай ижил байх ёстой (backend болон worker/.env хоёулаа).
      - '6379:6379'
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medreh_minio
      MINIO_ROOT_PASSWORD: medreh_minio_pw
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Веб консол (http://localhost:9001)
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
